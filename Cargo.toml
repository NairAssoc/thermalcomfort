[package]
name = "thermalcomfort"
version = "4.4.0"
edition = "2024"
rust-version = "1.85"
authors = ["Thermal Comfort Contributors"]
description = "A Rust port of pythermalcomfort for thermal comfort calculations (no_std, WASM-compatible)"
license = "MIT"
repository = "https://github.com/NairAssoc/thermalcomfort"
homepage = "https://github.com/NairAssoc/thermalcomfort"
documentation = "https://docs.rs/thermalcomfort"
readme = "README.md"
keywords = ["thermal", "comfort", "pmv", "hvac", "building"]
categories = ["science", "mathematics", "wasm", "no-std"]

[dependencies]
libm = "0.2"
measurements = { version = "0.11", default-features = false }
heapless = "0.8"

# Dense linear algebra, used by PET's 3-node solve. Built against `alloc` + `libm` rather
# than `std`: nalgebra has supported no_std since 0.15, so this is a normal dependency of
# a no_std crate, not a std opt-in. It was previously pinned to `features = ["std"]` and
# documented as "breaks no_std compatibility", which was never true and cost the crate a
# duplicated hand-rolled solver plus a feature flag that gated nothing.
nalgebra = { version = "0.33", default-features = false, features = ["alloc", "libm", "macros"] }

[dev-dependencies]
approx = "0.5"
pyo3 = { version = "0.23", features = ["auto-initialize"] }

[features]
default = []
# Retained as a no-op so existing `features = ["std"]` dependants keep building. It used
# to switch PET onto nalgebra; nalgebra is now unconditional and the two solvers it chose
# between produced identical results, so there is nothing left to gate. The crate version
# tracks pythermalcomfort's and cannot take a major bump on its own schedule, so this
# stays until upstream majors.
std = []
