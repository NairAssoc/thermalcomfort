name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable, beta]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Install components
        run: rustup component add rustfmt clippy

      # `cargo test` links the std test harness, so only a real no_std target build can
      # prove the crate still compiles without std. `make no-std-check` skips with a
      # notice when the target is absent, so CI must install it or the check is silent.
      - name: Install a no_std target
        run: rustup target add wasm32-unknown-unknown

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Derived from Cargo.toml, never hardcoded: the crate version IS the
      # pythermalcomfort version being ported. A literal pin here silently went stale
      # for four releases, so CI validated 3.9.x work against a 3.8.0 reference.
      - name: Install the pythermalcomfort version this crate ports
        shell: bash
        run: |
          PTC_VERSION="$(make parity-version)"
          echo "Installing pythermalcomfort==${PTC_VERSION}"
          pip install "pythermalcomfort==${PTC_VERSION}"

      - name: Run lint checks
        shell: bash
        run: make lint

      - name: Run tests
        shell: bash
        run: make test

  verify:
    name: Verify (what make verify runs locally)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the pythermalcomfort version this crate ports
        shell: bash
        run: |
          PTC_VERSION="$(make parity-version)"
          echo "Installing pythermalcomfort==${PTC_VERSION}"
          pip install "pythermalcomfort==${PTC_VERSION}"

      # The union of every other job, exactly as a developer runs it. Its job is to
      # prove that `make verify` and CI check the same things, so that a local pass is
      # evidence of a CI pass.
      - name: Install the targets and toolchain verify needs
        run: make setup-toolchain

      - name: Run make verify
        shell: bash
        run: make verify

  differential-sweep:
    name: Differential Sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the pythermalcomfort version this crate ports
        shell: bash
        run: |
          PTC_VERSION="$(make parity-version)"
          echo "Installing pythermalcomfort==${PTC_VERSION}"
          pip install "pythermalcomfort==${PTC_VERSION}"

      # A short sweep on every push, so a divergence gates the merge without making it
      # slow. `make sweep` is the deep run for a release check or a bug hunt.
      - name: Run differential sweep
        shell: bash
        run: make sweep-ci

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run cargo check
        run: make check

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: make fmt

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Run clippy
        run: make clippy

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build documentation
        run: make doc

  examples:
    name: Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build and run examples
        run: make examples

  no-std:
    name: no_std compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf, wasm32-unknown-unknown

      - name: Check the no_std targets and build wasm in release
        run: make no-std-check
