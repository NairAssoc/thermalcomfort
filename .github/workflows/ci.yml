name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable, beta]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Install components
        run: rustup component add rustfmt clippy

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Derived from Cargo.toml, never hardcoded: the crate version IS the
      # pythermalcomfort version being ported. A literal pin here silently went stale
      # for four releases, so CI validated 3.9.x work against a 3.8.0 reference.
      - name: Install the pythermalcomfort version this crate ports
        shell: bash
        run: |
          PTC_VERSION="$(make parity-version)"
          echo "Installing pythermalcomfort==${PTC_VERSION}"
          pip install "pythermalcomfort==${PTC_VERSION}"

      - name: Run lint checks
        shell: bash
        run: make lint

      - name: Run tests
        shell: bash
        run: make test

  python-comparison:
    name: Python Comparison Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the pythermalcomfort version this crate ports
        shell: bash
        run: |
          PTC_VERSION="$(make parity-version)"
          echo "Installing pythermalcomfort==${PTC_VERSION}"
          pip install "pythermalcomfort==${PTC_VERSION}"

      # Runs the whole tests/python_comparison.rs suite in both configurations. This
      # previously ran `cargo test test_compare_with_python`, a single test, so the
      # cross-library suite never executed in CI at all.
      - name: Run verification (including Python comparison)
        shell: bash
        run: make verify

  differential-sweep:
    name: Differential Sweep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install the pythermalcomfort version this crate ports
        shell: bash
        run: |
          PTC_VERSION="$(make parity-version)"
          echo "Installing pythermalcomfort==${PTC_VERSION}"
          pip install "pythermalcomfort==${PTC_VERSION}"

      # A short sweep on every push, so a divergence gates the merge without making it
      # slow. `make sweep` is the deep run for a release check or a bug hunt.
      - name: Run differential sweep
        shell: bash
        run: make sweep SWEEP_N=2000

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run cargo check
        run: cargo check --all-targets --verbose

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build documentation
        run: cargo doc --no-deps --verbose
        env:
          RUSTDOCFLAGS: -D warnings

  examples:
    name: Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build examples
        run: cargo build --examples --verbose

      - name: Run basic_pmv example
        run: cargo run --example basic_pmv

      - name: Run typed_api example
        run: cargo run --example typed_api

  no-std:
    name: no_std compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf

      - name: Check no_std build
        run: cargo check --target thumbv7em-none-eabihf --verbose

  wasm:
    name: WASM compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Check WASM build
        run: cargo check --target wasm32-unknown-unknown --verbose

      - name: Build WASM
        run: cargo build --target wasm32-unknown-unknown --verbose --release
